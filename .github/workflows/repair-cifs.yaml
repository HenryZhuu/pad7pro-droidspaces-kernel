name: Pad7Pro Droidspaces with matching CIFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl rsync cpio kmod build-essential libssl-dev libelf-dev openssl lz4 xz-utils zstd bison flex bc libtinfo5 python3 unzip
          mkdir -p "$HOME/.local/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name 'Kernel Builder'
          git config --global user.email 'kernel-builder@users.noreply.github.com'

      - name: Sync pinned 6.1.157 sources
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b 2794b9e9cd65be8ecf9a772bc32082598f0e6594 --depth=1
          mkdir -p .repo/local_manifests
          printf '%s\n' '<manifest><extend-project name="kernel/common" revision="e5cac90db2d54dbf93ebcda9152c24325167b5fe" /></manifest>' > .repo/local_manifests/pin.xml
          repo sync -c -j4 --no-clone-bundle --no-tags
          test "$(git -C common rev-parse HEAD)" = e5cac90db2d54dbf93ebcda9152c24325167b5fe
          mkdir -p "$GITHUB_WORKSPACE/build-record"
          repo manifest -r -o "$GITHUB_WORKSPACE/build-record/manifest.xml"

      - name: Prepare matching CIFS modules and original public trust certificate
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          s=Path('../.github/workflows/build.yaml').read_text()
          line=next(x for x in s.splitlines() if '| base64 -d >' in x)
          Path('../build-record/sysvipc-kabi.patch').write_bytes(base64.b64decode(line.split("'")[1]))
          PY
          git -C common apply --check "$GITHUB_WORKSPACE/build-record/sysvipc-kabi.patch"
          git -C common apply "$GITHUB_WORKSPACE/build-record/sysvipc-kabi.patch"
          echo '' | base64 -d > common/certs/stock-public.der
          test "$(sha256sum common/certs/stock-public.der | cut -d' ' -f1)" = 08cdae8ee32410117db28a47c9dd2a5e86e6fba7b22862b67c783ab0e94ea8e3
          openssl x509 -inform DER -in common/certs/stock-public.der -out common/certs/stock-public.pem
          cat > common/arch/arm64/configs/droidspaces.fragment <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_CIFS=m
          CONFIG_CIFS_STATS2=y
          CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
          CONFIG_CIFS_UPCALL=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y
          CONFIG_CIFS_DFS_UPCALL=y
          CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock-public.pem"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          modules=['fs/smb/client/cifs.ko','fs/smb/common/cifs_arc4.ko','fs/smb/common/cifs_md4.ko','net/dns_resolver/dns_resolver.ko']
          p=Path('common/BUILD.bazel');s=p.read_text()
          old='"module_implicit_outs": get_gki_modules_list("arm64"),'
          assert s.count(old)>=1
          replacement='"module_implicit_outs": get_gki_modules_list("arm64") + '+repr(modules)+','
          s=s.replace(old,replacement,1)
          marker='"android/abi_gki_aarch64_db845c",'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'\n        "android/abi_gki_aarch64_droidspaces_cifs",',1)
          p.write_text(s)
          p=Path('common/android/gki_aarch64_protected_modules')
          p.write_text('\n'.join(sorted(set(p.read_text().split())|set(modules)))+'\n')
          symbols=['cifs_arc4_setkey','cifs_arc4_crypt','cifs_md4_init','cifs_md4_update','cifs_md4_final','dns_query']
          Path('common/android/abi_gki_aarch64_droidspaces_cifs').write_text('[abi_symbol_list]\n'+'\n'.join('  '+x for x in sorted(symbols))+'\n')
          PY
          cp common/arch/arm64/configs/droidspaces.fragment "$GITHUB_WORKSPACE/build-record/"
          cp common/certs/stock-public.pem "$GITHUB_WORKSPACE/build-record/"
          git -C common add include/linux/sched.h arch/arm64/configs/droidspaces.fragment BUILD.bazel android/abi_gki_aarch64_droidspaces_cifs android/gki_aarch64_protected_modules certs/stock-public.der certs/stock-public.pem
          git -C common diff --cached > "$GITHUB_WORKSPACE/build-record/source-changes.patch"
          git -C common commit -m 'Build CIFS modules with Droidspaces kernel and retain original public trust'

      - name: Build kernel and matching drivers
        working-directory: kernel
        run: |
          set -o pipefail
          tools/bazel run //common:kernel_aarch64_dist --config=fast --config=stamp --lto=thin --defconfig_fragment=//common:arch/arm64/configs/droidspaces.fragment -- --dist_dir="$GITHUB_WORKSPACE/dist" 2>&1 | tee "$GITHUB_WORKSPACE/build-record/build.log"

      - name: Verify exported configuration and modules
        run: |
          set -euxo pipefail
          test -s dist/Image
          test -s dist/kernel_aarch64_Module.symvers
          kernel/common/scripts/extract-ikconfig dist/Image > dist/.config
          for option in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE MODVERSIONS MODULE_SIG_PROTECT; do
            grep -qx "CONFIG_${option}=y" dist/.config
          done
          grep -qx 'CONFIG_CIFS=m' dist/.config
          if grep -Eq '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS)=y$' dist/.config; then exit 1; fi
          for name in cifs cifs_arc4 cifs_md4 dns_resolver; do
            test -s "dist/$name.ko"
            modinfo "dist/$name.ko" > "build-record/$name.modinfo.txt"
            test -n "$(modinfo -F signer "dist/$name.ko")"
          done
          cp dist/.config build-record/final.config
          sha256sum dist/Image dist/cifs.ko dist/cifs_arc4.ko dist/cifs_md4.ko dist/dns_resolver.ko > build-record/SHA256SUMS
          echo 'Matching CIFS replacement modules included. Original vendor_boot requires repacking; offline compatibility and device boot tests are pending.' > build-record/STATUS.txt

      - name: Preserve kernel, drivers and verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad7pro-6.1.157-droidspaces-cifs-repair
          include-hidden-files: true
          retention-days: 7
          path: |
            dist/Image
            dist/*.symvers
            dist/.config
            dist/System.map
            dist/vmlinux
            dist/cifs.ko
            dist/cifs_arc4.ko
            dist/cifs_md4.ko
            dist/dns_resolver.ko
            build-record/
