name: Build verified Droidspaces kernel
run-name: Kernel ${{ inputs.profile || 'muyu-os4.0.3.0' }} / ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware profile ID
        type: string
        default: muyu-os4.0.3.0
        required: true
      request_id:
        description: Optional tracking ID used by the local one-command tool
        type: string
        default: manual
      use_cache:
        description: Reuse public source downloads
        type: boolean
        default: true
      include_debug:
        description: Also upload the large vmlinux debugging file
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - profiles/**
      - configs/**
      - patches/**
      - kernelkit/**
      - tools/**
      - requirements*.txt
      - .github/workflows/build.yaml

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}-${{ inputs.profile || 'muyu-os4.0.3.0' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PROFILE: ${{ inputs.profile || 'muyu-os4.0.3.0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned Python dependencies and compiler prerequisites
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y git curl rsync cpio kmod build-essential libssl-dev libelf-dev openssl lz4 xz-utils zstd bison flex bc libtinfo5 unzip
          git config --global user.name 'Kernel Builder'
          git config --global user.email 'kernel-builder@users.noreply.github.com'
      - name: Check project and profile
        id: profile
        run: |
          python -m unittest discover -s tests -v
          python tools/profile_outputs.py "$PROFILE"
      - name: Initialize pinned source manifest and repo tool
        run: bash tools/build.sh init
      - name: Restore public Git source objects only
        id: source-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/kernel/.repo/project-objects
          key: source-v1-${{ runner.os }}-${{ steps.profile.outputs.source_cache_key }}
          restore-keys: source-v1-${{ runner.os }}-
      - name: Sync pinned sources
        run: bash tools/build.sh sync
      - name: Compile and verify kernel and replacement modules
        run: bash tools/build.sh build
      - name: Upload verified kernel payload without private signing keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-${{ steps.profile.outputs.id }}
          include-hidden-files: true
          retention-days: 14
          path: |
            dist/Image
            dist/.config
            dist/System.map
            dist/*.symvers
            dist/cifs.ko
            dist/cifs_arc4.ko
            dist/cifs_md4.ko
            dist/dns_resolver.ko
            build-record/
      - name: Save bounded public source cache
        if: (github.event_name != 'workflow_dispatch' || inputs.use_cache) && steps.source-cache.outputs.cache-hit != 'true'
        run: |
          size=$(du -sm .local/kernel/.repo/project-objects | cut -f1)
          if [ "$size" -le 6144 ]; then echo 'SAVE_SOURCE_CACHE=true' >> "$GITHUB_ENV"; fi
      - name: Persist source cache
        if: env.SAVE_SOURCE_CACHE == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/kernel/.repo/project-objects
          key: source-v1-${{ runner.os }}-${{ steps.profile.outputs.source_cache_key }}
      - name: Preserve logs and metadata even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: build-record/
      - name: Optional large debugging artifact
        if: inputs.include_debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-${{ github.run_id }}
          retention-days: 3
          path: dist/vmlinux
